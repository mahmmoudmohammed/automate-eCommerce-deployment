name: Deploy react
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ma7moudsharqawi/client ./microservices/client
      - run: docker build -t ma7moudsharqawi/nginx ./microservices/nginx
      - run: docker build -t ma7moudsharqawi/server ./microservices/server
      - run: docker build -t ma7moudsharqawi/worker ./microservices/worker

      - run: docker push ma7moudsharqawi/client
      - run: docker push ma7moudsharqawi/nginx
      - run: docker push ma7moudsharqawi/server
      - run: docker push ma7moudsharqawi/worker
