name: Deploy react
on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ma7moudsharqawi/frontend ./frontend
      - run: docker build -t ma7moudsharqawi/nginx ./nginx
      - run: docker build -t ma7moudsharqawi/backend ./backend
      - run: docker build -t ma7moudsharqawi/worker ./worker

      - run: docker push ma7moudsharqawi/frontend
      - run: docker push ma7moudsharqawi/nginx
      - run: docker push ma7moudsharqawi/backend
      - run: docker push ma7moudsharqawi/worker
